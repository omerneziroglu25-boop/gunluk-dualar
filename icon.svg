<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05101a"/>
      <stop offset="50%" stop-color="#0b1e2e"/>
      <stop offset="100%" stop-color="#04090f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa8010"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>
  
  <!-- Crescent & Star -->
  <path d="M280 130 A110 110 0 1 0 350 330 A130 130 0 1 1 280 130 Z" fill="url(#gold)"/>
  
  <!-- Open Book (Holy Dua Book) -->
  <g transform="translate(136, 260)">
    <!-- Left Page -->
    <path d="M120 40 C70 10 20 20 0 30 L0 150 C20 140 70 130 120 160 Z" fill="url(#gold)" opacity="0.9"/>
    <!-- Right Page -->
    <path d="M120 40 C170 10 220 20 240 30 L240 150 C220 140 170 130 120 160 Z" fill="url(#gold)" opacity="0.9"/>
    <!-- Center Spine -->
    <line x1="120" y1="40" x2="120" y2="160" stroke="#05101a" stroke-width="4"/>
    <!-- Text Lines Left -->
    <line x1="20" y1="65" x2="100" y2="70" stroke="#05101a" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="90" x2="100" y2="95" stroke="#05101a" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="115" x2="90" y2="120" stroke="#05101a" stroke-width="3" stroke-linecap="round"/>
    <!-- Text Lines Right -->
    <line x1="140" y1="70" x2="220" y2="65" stroke="#05101a" stroke-width="3" stroke-linecap="round"/>
    <line x1="140" y1="95" x2="220" y2="90" stroke="#05101a" stroke-width="3" stroke-linecap="round"/>
    <line x1="150" y1="120" x2="220" y2="115" stroke="#05101a" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Little Eight-pointed Star on Top -->
  <polygon points="340,165 345,178 358,183 345,188 340,201 335,188 322,183 335,178" fill="url(#gold)"/>
</svg>